# Deploys the Supabase Edge Functions whenever function code reaches main.
# The website itself is built and deployed separately by Cloudflare Pages.
#
# One-time setup (GitHub → Settings → Secrets and variables → Actions → New repository secret):
#   SUPABASE_ACCESS_TOKEN  a Supabase access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_REF   the project's reference ID, e.g. the "abcd…" in https://abcd….supabase.co
#
# Database migrations are NOT applied here on purpose: the older files in
# supabase/migrations were run by hand and must not be replayed automatically.
name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: deploy-supabase-functions
  cancel-in-progress: false

jobs:
  test:
    name: Payment tests
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    name: Deploy functions
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check repository secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF repository secrets (Settings → Secrets and variables → Actions), then re-run this workflow."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # With no function name, every function in supabase/functions is deployed
      # (the _shared folder is not a function). Per-function JWT settings come
      # from supabase/config.toml; payment-callback must stay unauthenticated.
      - name: Deploy
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
      - name: List deployed functions
        run: supabase functions list --project-ref "$SUPABASE_PROJECT_REF"
